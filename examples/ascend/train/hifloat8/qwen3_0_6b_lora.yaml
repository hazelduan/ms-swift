model: Qwen/Qwen3-0.6B
template: qwen3
torch_dtype: bfloat16
tuner_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
lora_bias: none
lora_dtype: bfloat16
target_modules:
  - gate_proj
  - up_proj
  - down_proj

dataset: examples/ascend/train/hifloat8/data/train.jsonl
val_dataset: examples/ascend/train/hifloat8/data/eval.jsonl
split_dataset_ratio: 0.0
dataset_shuffle: false
val_dataset_shuffle: false
train_dataloader_shuffle: true
max_length: 640
truncation_strategy: right

max_steps: 100
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1
gradient_checkpointing: false
learning_rate: 1.0e-4
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
lr_scheduler_type: cosine
warmup_ratio: 0.0
max_grad_norm: 1.0

eval_strategy: steps
eval_steps: 25
eval_metric: acc
save_strategy: steps
save_steps: 50
save_total_limit: 2
logging_steps: 1
logging_nan_inf_filter: false
report_to: none
seed: 42
data_seed: 42
dataloader_num_workers: 0
dataloader_persistent_workers: false
dataset_num_proc: 1
packing: false
padding_free: false
use_liger_kernel: false
include_num_input_tokens_seen: true
add_version: false

external_plugins: examples/ascend/train/hifloat8/step_timer.py
callbacks: hifloat8_step_timer
deepspeed: examples/ascend/train/hifloat8/zero2_bf16.json
output_dir: output/hifloat8/lora_bf16
